# Alembic configuration for DCS Landing Teacher.
#
# The application runs migrations programmatically at startup
# (app/models/migrations.py); this file supports manual CLI usage:
#
#   cd backend
#   alembic current          # show applied revision
#   alembic upgrade head     # apply pending migrations
#   alembic revision -m "..."# create a new empty revision
#
# The database URL is injected programmatically (sqlalchemy.url below is a
# placeholder); override it with -x db_url=... when using the CLI directly.

[alembic]
script_location = %(here)s/migrations
sqlalchemy.url = sqlite:///./data/dlt.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
