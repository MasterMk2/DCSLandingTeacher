[project]
name = "dcs-landing-teacher-backend"
version = "0.3.0"
description = "DCS landing / carrier-arrestment review and grading tool (backend)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.141",
    "httpx2>=2.12",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22",
    "basedpyright>=1.40",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Ensure the project root (backend/) is on sys.path so that tests can be
# imported as a package ("from tests.helpers import ...") regardless of how
# pytest is invoked (bare "pytest" vs "python -m pytest").
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Minimal, low-noise baseline: pycodestyle errors, pyflakes.
select = ["E4", "E7", "E9", "F"]
