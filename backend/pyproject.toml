[project]
name = "dcs-landing-teacher-backend"
version = "0.3.0"
description = "DCS landing / carrier-arrestment review and grading tool (backend)"
requires-python = ">=3.11"
# License: MIT (see ../LICENSE at the repository root)
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # The asyncio extension needs greenlet. SQLAlchemy 2.0 pulled it in by
    # itself; 2.1 (on PyPI since CI run 2026-09-25) only does so through the
    # [asyncio] extra, and without it every import of sqlalchemy.ext.asyncio
    # dies with "No module named 'greenlet'" -- in CI, and in a freshly built
    # image, where the app would not even start.
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx2>=2.12.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.20",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Ensure the project root (backend/) is on sys.path so that tests can be
# imported as a package ("from tests.helpers import ...") regardless of how
# pytest is invoked (bare "pytest" vs "python -m pytest").
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Minimal, low-noise baseline: pycodestyle errors, pyflakes.
select = ["E4", "E7", "E9", "F"]
