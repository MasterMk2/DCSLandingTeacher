[project]
name = "migration-job"
version = "0.1.0"
description = "Explicit Alembic migration job for PostgreSQL schema changes in DCS Landing Teacher."
requires-python = "==3.11.*"
dependencies = [
    "alembic>=1.19",
    "psycopg[binary]>=3.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
migration-job = "migration_job.commands.run_migration_job:main"
migration-job-revision = "migration_job.commands.create_revision:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "pytest>=9.1",
    "pytest-mock>=3.15",
    "pytest-sqlalchemy-alembic>=0.2",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_job"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.basedpyright]
include = ["migrations", "src", "tests"]
exclude = ["migrations/versions"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
