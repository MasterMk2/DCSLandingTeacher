# DCS Landing Teacher - grading thresholds and geometry.
# All values are tunable without code changes; loaded by app.grading.config.
#
# Coordinate conventions used by the graders:
#   - "along"  : meters from the touchdown/reference point, positive TOWARDS
#                the approach (i.e. distance-to-go before touchdown).
#   - "lateral": meters from the centerline, positive to the RIGHT of the
#                approach course.
#   - "gs_dev" : meters above (+) / below (-) the ideal glideslope at the
#                sample's distance-to-go.

version: 1

geometry:
  # FLOLS-style glideslope for carrier approaches (ramp-referenced).
  carrier_glideslope_deg: 3.5
  # Land aerodromes use a fixed 3-degree reference path (Issue D-5). This is
  # the standard visual approach slope; keep it at 3.0 unless a specific
  # airfield publishes a different PAPI/VASI angle.
  land_glideslope_deg: 3.0
  # Optional separate reference for the overhead pattern, whose final is
  # flown visually and much shorter than an instrument final. Left null it
  # uses land_glideslope_deg.
  #
  # There is no authoritative public number for "the" overhead final angle:
  # AFMAN 11-217 puts ILS glideslopes at 2.5-3.0 deg depending on siting,
  # and the overhead pattern itself is specified geometrically (roll out no
  # lower than 300 ft AGL, no closer than 1/4 mile) rather than as an angle.
  # Measured on this server (2026-08-27, 4 overhead landings with a usable
  # final): mean path angle median 2.72 deg, range 1.56-3.28. Too few
  # samples to conclude; set this to 2.5 and re-grade if you want to try it.
  overhead_glideslope_deg: null
  earth_radius_m: 6371000.0

approach:
  # Final-approach segment cut out before touchdown (FR-2: ~2nm / ~60 s).
  # This is the carrier figure; carrier passes have no pattern to capture
  # and the LSO grader only looks at the last seconds.
  window_s: 60.0
  distance_m: 3704.0   # 2 nm
  # Land landings capture further back, because the graded pattern (break
  # -> downwind -> base -> final) does not fit in 60 s / 2 nm: a fighter
  # circuit at 1.5 nm abeam is already ~4.5 km from the touchdown point.
  # Raising these only changes how much of each approach is STORED, and
  # the per-object track table dwarfs it either way.
  # Wide enough to start a little BEFORE the initial: the run-in to a
  # fighter overhead begins 3-5 nm out, so 5 nm put the first recorded
  # sample right on top of it. The walk-back stops at the previous ground
  # contact regardless, so a closed pattern still yields one circuit.
  land_window_s: 300.0
  land_distance_m: 14816.0   # 8 nm

detection:
  # Weight-on-wheels equivalent: AGL at or below this is "on deck".
  wow_agl_threshold_m: 3.0
  # Descent rate (m/s) above which a ground contact is treated as a crash,
  # not a landing attempt.
  max_touchdown_descent_ms: 8.0
  # Ground time after which a touchdown is a full-stop landing.
  full_stop_dwell_s: 15.0
  # If the aircraft climbs out within this time after touchdown it is a
  # touch-and-go (land) or bolter (carrier).
  touch_and_go_max_dwell_s: 45.0
  # Vertical speed (m/s) considered "climbing out" after a bounce/bolter.
  climb_out_vertical_ms: 1.5
  # Touchdown counts as a carrier arrestment when a carrier is within this
  # horizontal distance.
  carrier_proximity_m: 800.0
  # Rolling buffer of samples kept per aircraft for real-time detection.
  sample_buffer_s: 600.0

land_grading:
  # Score components are 0..100 each; total is the weighted mean.
  # Weights are normalised before the mean is taken, so a component that
  # could not be measured lowers nobody's score -- it just drops out.
  weights:
    descent_rate: 0.30
    touchdown_speed: 0.20
    glideslope: 0.25
    centerline: 0.25
  # Used instead of `weights` when the approach was classified "overhead".
  # The pattern is half the exercise in an overhead break, so it gets a
  # share of its own rather than being invisible to the score.
  overhead_weights:
    descent_rate: 0.25
    touchdown_speed: 0.15
    glideslope: 0.20
    centerline: 0.20
    pattern: 0.20

  # ---------------------------------------------------------------------
  # Segmentation: where the final approach starts.
  #
  # Everything below that is measured "on final" needs to know where final
  # begins. A fixed lookback cannot answer that: in an overhead pattern the
  # aircraft is still in the base turn 30 s before touchdown. The roll-out
  # is found from the GROUND TRACK in runway coordinates (not the aircraft
  # heading -- crab angle is irrelevant to pattern geometry, and heading is
  # not stored in older approach tracks).
  # ---------------------------------------------------------------------
  # Lookback used to differentiate position into a track angle. One sample
  # interval (~0.25 s) is buried in position quantisation noise.
  track_smoothing_s: 2.0
  # Below this displacement the track angle is undefined (hover, ground roll).
  track_min_step_m: 20.0
  # Track angle within this of the runway course counts as "on final".
  rollout_align_deg: 15.0
  # ...and within this of the LANDING direction counts as the initial, which
  # is where the break turn is taken to have started.
  initial_align_deg: 20.0
  # The downwind leg is found in two stages, and it matters that they are
  # separate. The cone only says "the aircraft is on the downwind side of
  # the pattern" (as opposed to final or upwind) and is deliberately wide;
  # the leg's ENDS are decided by turn rate, i.e. by where the aircraft
  # stopped/started turning.
  #
  # Using closeness-to-the-reciprocal to find the end of the leg -- which is
  # what this did until 2026-08-27 -- is self-referential: that closeness IS
  # the quantity being measured, so the more a downwind is off, the less
  # band is left before the base turn counts as part of it, and the pulled
  # fit reports the leg as better aligned than it was. Landing #27 flew a
  # rock-steady 11.6 deg off for 9 s and was reported at 6.4 deg because
  # 6 s of base turn had been swallowed.
  downwind_cone_deg: 60.0
  downwind_max_turn_rate_deg_s: 1.5
  # Stabilization gate: the approach is judged from the moment it last
  # descended through this AGL (or the roll-out, whichever is LATER).
  #
  # This is what lets a long stabilized straight-in be judged over the 3 nm
  # it was actually flown instead of its last kilometre, while an overhead
  # pattern still starts at the roll-out. The gate is defined by height, not
  # by how close to the slope the aircraft was: a tolerance-based rule would
  # pick the on-slope samples and then score how on-slope they are, so an
  # approach flown at 5 deg for 2 nm and joined to 3 deg for the last mile
  # would come out perfect. 1000 ft is the usual stabilized-approach gate.
  stabilization_gate_agl_m: 305.0   # 1000 ft

  # Touchdown descent rate bands in feet per minute, per airframe class.
  # Scores interpolate linearly between bands (a step function makes 450
  # fpm worth 80 points and 451 fpm worth 55, for the same landing).
  #
  # Why per class: a fighter flown at on-speed AoA down a 3 deg path with a
  # short flare touches down around 400-500 fpm by design, and its gear is
  # built for it. Grading that against transport-category bands (the
  # `default` row) reported "hard" for correctly flown F-16 landings.
  # Airframes are matched by substring against the ACMI name, in the order
  # listed under airframe_classes; anything unmatched uses `default`.
  descent_rate_fpm:
    default:
      excellent: 120   # <= this -> 100 pts
      good: 250        # <= this -> 80 pts
      fair: 450        # <= this -> 55 pts
      hard: 650        # <= this -> 30 pts, decaying to 5
    fighter:
      excellent: 300
      good: 450
      fair: 650
      hard: 850
    helicopter:
      excellent: 100
      good: 200
      fair: 350
      hard: 550
  airframe_classes:
    helicopter:
      ["UH-1", "AH-64", "AH-1", "UH-60", "CH-47", "KA-50", "Mi-8", "Mi-24",
       "SA342", "OH-58"]
    fighter:
      ["F-16", "FA-18", "F/A-18", "F-15", "F-14", "F-5", "F-4", "F-86",
       "F-100", "F-117", "A-10", "AV8B", "AJS37", "Viggen", "JF-17",
       "M-2000", "Mirage", "MiG-", "Su-2", "Su-3", "J-11", "Tornado",
       "EF2000"]

  # Touchdown speed judged RELATIVE to the mean speed of the STABILIZED
  # FINAL (airframe independent). ratio = touchdown speed / that mean.
  #
  # The bands are deliberately asymmetric. Arriving a few per cent slower
  # than approach speed is what a flare *is*; a symmetric +/-5% band scored
  # correctly flown landings as "off speed". Touching down FASTER than
  # approach speed, on the other hand, means float and runway remaining, so
  # that side stays tight.
  touchdown_speed_ratio:
    slow_good: 0.88      # >= this -> 100 pts
    slow_fair: 0.80      # >= this -> 65 pts, decaying to 30
    fast_good: 1.03      # <= this -> 100 pts
    fast_fair: 1.10      # <= this -> 65 pts, decaying to 30
  # Seconds before touchdown excluded from the reference mean: that is the
  # flare, where losing speed is the point. Including it would make the
  # reference chase the number being judged.
  speed_flare_exclude_s: 4.0
  # Glideslope tracking, judged as an ANGULAR error against the reference
  # slope. Metres are not usable here: the same piloting accuracy produces a
  # far bigger metre error 1.5 km out than over the threshold, so fixed
  # metre thresholds silently demand ILS Cat III precision at range and
  # floor the component for every landing. good is roughly the PAPI
  # "on slope" band.
  glideslope_error_deg:
    good: 0.35
    fair: 0.70
    poor: 1.50
  # Only the approach UP TO THE THRESHOLD is judged against the slope: past
  # it the aircraft is flaring and is supposed to be above a slope anchored
  # at the aiming point. Touchdown quality is the descent_rate component's
  # job. Without resolved runway geometry the AGL floor approximates the
  # threshold crossing height.
  #
  # glideslope_window_s is now only the FALLBACK, used when neither anchor
  # above exists (no turn to roll out of, never above the gate -- e.g. a low
  # slow rotary-wing approach). Otherwise the window runs from
  # max(roll-out, gate) to the threshold and has no fixed length.
  glideslope_window_s: 30.0
  glideslope_min_agl_m: 15.0
  # Angles computed from a few metres of distance are meaningless; below
  # this range the glidepath is simply not judged (neutral score) rather
  # than reporting tens of degrees of nonsense for e.g. a hover-on.
  glideslope_min_distance_m: 200.0
  # Centerline keeping: max |lateral offset| over the final seconds, meters.
  # Keep this window short. Judging the max over a long window means the
  # earliest sample decides the score, while the aircraft is still 1.5 km
  # out and legitimately converging -- which penalises overhead patterns for
  # rolling out of the turn later, i.e. for the pattern itself.
  centerline_window_s: 5.0
  centerline_deviation_m:
    good: 3.0
    fair: 8.0
    poor: 20.0

  # ---------------------------------------------------------------------
  # Overhead pattern (scored only when approach_pattern == "overhead").
  # Judges the circuit, not the last few seconds: by the time the aircraft
  # is on final the pattern has already decided whether it is set up or
  # being salvaged.
  # ---------------------------------------------------------------------
  pattern:
    # A downwind shorter than this is not a leg; it is not judged. (The
    # metrics are still reported so it is visible why.) At pattern speeds
    # 5 s is ~400 m, which is enough to read a heading off; conditioning of
    # the fit itself is guarded separately by its own 200 m span minimum.
    min_downwind_s: 5.0
    # Anything shorter than this is not a break turn, just a heading change.
    min_break_s: 6.0
    # Height gained or lost during the break, which is supposed to be a
    # LEVEL 180 deg turn: whatever is lost here is what puts the downwind
    # off pattern altitude. Measured 19-294 m over this server's overhead
    # landings (2026-08-27), so the band separates technique rather than
    # noise. 30 m is about 100 ft.
    break_altitude_spread_m:
      good: 30.0
      fair: 75.0
      poor: 180.0
    # Lateral offset left over when the turn to final was completed --
    # rolled out short of the centerline (undershoot) or through it
    # (overshoot). Both are the same misjudged perch, so one band; the
    # sign is kept in the evidence.
    alignment_error_m:
      good: 100.0
      fair: 250.0
      poor: 600.0
    # How far the downwind ground track was from the runway reciprocal.
    # A downwind that is not parallel guarantees a base turn that cannot
    # roll out on centerline, whatever is done at the perch.
    downwind_course_error_deg:
      good: 8.0
      fair: 18.0
      poor: 35.0
    # Altitude spread (max - min) over the downwind leg. Holding pattern
    # altitude is what makes the perch point repeatable.
    downwind_altitude_spread_m:
      good: 45.0    # ~150 ft
      fair: 90.0    # ~300 ft
      poor: 200.0
    # Abeam distance is measured and shown in the evidence but NOT scored:
    # the "right" spacing differs per airframe and per squadron habit, and
    # there is no calibration data here to justify attaching points to it.
  # Final letter grades by weighted score.
  letters:
    A: 90
    B: 78
    C: 62
    D: 45   # below -> E

lso_grading:
  # Grades in US Navy style (FR-3).
  grades:
    ok: "OK"
    ok_minus: "OK-"
    ok_paren: "(OK)"
    no_grade: "_NO_GRADE_"
    cut: "CUT"
  # Window (seconds before touchdown) used for "at the ramp" evaluations.
  at_ramp_window_s: 3.0
  factors:
    HIGH:
      severity: major
      description: "グライドスロープ高 - 理想進入経路より著しく高い位置を飛行している"
      details: "ランプ直前3秒間の平均グライドスロープ偏差が+3.0mを超えた場合に検出されます。高すぎると着艦点が奥にずれ、ワイヤーを外すリスクが高まります。"
      # Mean glideslope deviation over the at-ramp window above this -> HIGH.
      gs_deviation_m: 3.0
    LOW:
      severity: major
      description: "グライドスロープ低 - 理想進入経路より著しく低い位置を飛行している"
      details: "ランプ直前3秒間の平均グライドスロープ偏差が-2.0mを下回った場合に検出されます。低すぎるとランプストライクや前部ワイヤーへの衝突リスクが高まり、ウェーブオフ対象となります。"
      gs_deviation_m: -2.0
    FAST:
      severity: major
      description: "速度超過 - 進入速度が適正範囲を超えている"
      details: "着艦速度/平均進入速度の比が1.07を超えた場合に検出されます。速すぎるとアレスティングギアの許容エネルギーを超え、ボルターやギア損傷の原因となります。"
      # touchdown speed / mean final-approach speed above this -> FAST.
      speed_ratio: 1.07
    SLOW:
      severity: major
      description: "速度不足 - 進入速度が適正範囲を下回っている"
      details: "着艦速度/平均進入速度の比が0.93を下回った場合に検出されます。遅すぎると揚力不足で沈み込み、ハードランディングやスタールのリスクがあります。"
      speed_ratio: 0.93
    OFFLINE:
      severity: major
      description: "センターライン逸脱 - 着艦コースから左右に大きく外れている"
      details: "ランプ直前3秒間の最大横方向オフセットが3.0mを超えた場合に検出されます。センターラインから外れるとワイヤー捕捉位置がずれ、アレスティングギアへの偏荷重やデッキエッジ衝突の危険があります。"
      # |lateral offset| at the ramp above this -> OFFLINE.
      lateral_deviation_m: 3.0
    POWER:
      severity: minor
      description: "パワー変動 - スロットル操作が激しく速度が安定していない"
      details: "着艦直前20秒間の最大・最小速度差が8.0m/sを超えた場合に検出されます。頻繁なスロットル操作は進入が安定していないことを示し、グライドスロープ/センターライン維持が困難になります。"
      # Airspeed excursions (max-min) over the last 20 s above this -> POWER.
      speed_range_ms: 8.0
    BOLTER:
      severity: major
      description: "ボルター - 全ワイヤーを外して着艦失敗、着艦復行となった"
      details: "着艦アウトカムが 'bolter' と判定された場合に自動的に付与されます。全ワイヤーを外したことを意味し、即座に着艦復行 (go-around) を実施する必要があります。"
      # Set automatically when the outcome is a bolter.
      auto: true
    # The following factors require data Tacview does not reliably provide
    # (hook/rudder/engine states). They are declared here so the UI can list
    # them, but the detector currently never emits them.
    ARCON:
      severity: minor
      enabled: false
      description: "アレストメント・コントロール (Arrestment Control) - 着艦制御不良"
      details: "フック操作やブレーキ操作の不備。ACMIデータからは検出不可のため無効化されています。"
    AOC:
      severity: minor
      enabled: false
      description: "アプローチ・アウト・オブ・コントロール (Approach Out of Control) - 進入制御不能"
      details: "進入中の異常な機動や姿勢乱れ。ACMIデータからは検出不可のため無効化されています。"
    AOS:
      severity: minor
      enabled: false
      description: "エア・オペレーション・セーフティ (Air Operation Safety) - 航空運用安全"
      details: "安全規程違反や危険な機動。ACMIデータからは検出不可のため無効化されています。"
    INTAKE:
      severity: minor
      enabled: false
      description: "インテーク (Intake) - エンジンインテーク関連"
      details: "エンジンインテークの異常やFOD懸念。ACMIデータからは検出不可のため無効化されています。"
    IMMAT:
      severity: minor
      enabled: false
      description: "イマチュア (Immature) - 未熟な操作/判断"
      details: "経験不足による不適切な判断や操作。主観的評価のため自動検出不可。"
    T&R:
      severity: minor
      enabled: false
      description: "スロットル・アンド・ラダー (Throttle & Rudder) - スロットル/ラダー操作"
      details: "過度なスロットル・ラダー操作によるヨー/推力制御不良。ACMIデータからは検出不可のため無効化されています。"
    NWS:
      severity: minor
      enabled: false
      description: "ノーズホイール・ステアリング (Nose Wheel Steering) - 前輪操舵"
      details: "着艦後の前輪操舵操作不良。着艦ロールアウト時の評価項目。ACMIデータからは検出不可。"
    OPEN:
      severity: minor
      enabled: false
      description: "オープン (Open) - フック開放/未着艦状態"
      details: "テールフックが開放されていない、または着艦態勢に入っていない。ACMIデータからは検出不可。"
    # Issue #4 (O-3): ACMI 2.2 has NO wind properties (global properties are
    # recording metadata only; object properties cover kinematics/aircraft
    # state), so wind-over-deck based detection is impossible. BURBLE is
    # instead inferred from a sudden increase of the derived descent rate
    # just before touchdown vs. the preceding final-approach baseline --
    # the characteristic burble sink. Thresholds below are UNVALIDATED
    # estimates; tune them against real DCS approach data before trusting
    # the factor.
    BURBLE:
      severity: minor
      enabled: false           # DISABLED: ACMI 2.2 has no wind data; heuristic is unvalidated
      description: "バーブル (Burble) - 甲板後方の乱気流(バースト)による沈み込み"
      details: "着艦直前3秒間の平均沈下率が、直前12秒間のベースライン比で+1.5m/sを超えた場合に検出されます。空母後方の甲板乱気流(バーブル)に入った際の特徴的な急激な沈み込みをヒューリスティックに推定します。実データでの調整が必要です。ACMI 2.2 には風データがないため、このヒューリスティックは無効化されています。実データで検証されるまで有効にしないでください。"
      window_s: 3.0            # sink evaluation window before touchdown
      baseline_window_s: 12.0  # stable-approach reference window before that
      extra_descent_ms: 1.5    # mean extra sink (m/s) over baseline to trigger
  # Grade decision rules, evaluated in order.
  decision:
    # A mean glideslope deviation below this at the ramp is a wave-off.
    cut_low_gs_deviation_m: -4.5
    # Any of these conditions -> CUT.
    cut_if_severe_low: true
    cut_if_major_count: 3     # >= 3 major factors -> CUT
    # Exactly this many major factors -> (OK); one -> OK-; none -> OK.
    ok_paren_major_count: 2
