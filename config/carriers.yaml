# DCS Landing Teacher - per-carrier FLOLS geometry (Issue #3 / O-2).
#
# Values below are based on:
# - DCS Forum "By the Numbers: Carrier Landing Geometry & the IFLOLS" (Matthew10_28, 2018)
#   - IFLOLS model position error: +1.792 ft (0.55m) vertical correction needed
#   - 3-wire hook touchdown target: ~230 ft (70m) from stern
# - DCS Supercarrier Operations Guide (Eagle Dynamics)
#   - IFLOLS mounted on port side, elevation transmitter above flight deck aft of island
# - Hoggit Wiki "Carrier Air Operations" & community knowledge
#   - Nimitz-class angled deck offset: 9° from BRC (Base Recovery Course)
#   - Standard USN FLOLS glideslope: 3.5°
# - Wikipedia / public specifications for ship dimensions
#
# !! NOTE: Values are derived from community research and public docs.
#    They are more accurate than pure estimates but should still be
#    validated against in-game measurements for precision grading.
#
# How the geometry is used by the grader (app.grading.deviations):
#   - The glideslope reference point is the RAMP (the FLOLS datum at the
#     aft end of the angled deck), expressed as an offset from the ship's
#     ACMI position:
#       ramp_along_m   : meters forward of the ship position (+) toward
#                         the bow / negative toward the stern.
#       ramp_lateral_m : meters to the RIGHT (+) of the ship heading.
#   - deck_altitude_m is the height of the landing-area deck above sea
#     level (MSL); it replaces the proximity-based ground elevation when
#     computing AGL for glideslope deviations.
#   - landing_course_offset_deg is the angle of the landing course
#     relative to the ship heading (angled-deck carriers ~ 9 degrees,
#     axial-deck carriers ~ 0).
#   - beam_width_m is the approximate lateral width of the FLOLS light
#     beam; informational only (UI display), not used by grading yet.
#
# Matching: `name_patterns` are matched case-insensitively against the
# ACMI object Name; `type_patterns` against the ACMI Type string. First
# entry that matches wins; ships not listed here fall back to the legacy
# touchdown-referenced approximation (see app/grading/deviations.py).

version: 2

defaults:
  # Used as fallback values for entries that omit a field.
  glideslope_deg: 3.5        # standard USN FLOLS slope
  landing_course_offset_deg: 9.0   # typical angled-deck bearing (Nimitz/Forrestal)
  beam_width_m: 12.0         # rough FLOLS beam width

carriers:
  kuznetsov:
    name_patterns: ["kuznetsov"]
    type_patterns: ["Carrier+FixedWing", "AircraftCarrier+Kuznetsov"]
    # Admiral Kuznetsov (Project 1143.5): STOBAR with ski-jump.
    # Landing run is nearly axial (minimal angled deck offset).
    # Russian FLOLS equivalent (Klystron) typically set steeper than USN.
    # Deck height higher due to ski-jump bow structure.
    # Sources: DCS community data, Kuznetsov specs (flight deck ~22m above waterline at landing area)
    deck_altitude_m: 22.0            # Flight deck height at landing area (MSL)
    ramp_along_m: -110.0             # Ramp/IFLOLS datum ~110m aft of ship reference (stern area)
    ramp_lateral_m: 5.0              # Near centerline for axial approach (slight starboard for angled landing area)
    glideslope_deg: 4.0              # Steeper glideslope typical for STOBAR (Russian practice)
    landing_course_offset_deg: 2.0   # Nearly axial, slight offset for landing area alignment
    beam_width_m: 10.0               # Narrower beam (older optics)

  stennis:
    name_patterns: ["stennis", "cvn-74", "nimitz"]
    type_patterns: ["Carrier+Hornet", "AircraftCarrier+Stennis", "Carrier+Nimitz"]
    # USS John C. Stennis (CVN-74), Nimitz-class.
    # Angled deck: 9° offset from ship heading (BRC).
    # IFLOLS on port side of landing area.
    # 3-wire target: ~230 ft (70m) from stern per ED Supercarrier Guide.
    # IFLOLS vertical position: community research suggests +0.55m correction vs model.
    # Sources: DCS Forum (Matthew10_28), ED Supercarrier Operations Guide, Hoggit Wiki
    deck_altitude_m: 19.5            # Flight deck height at landing area (MSL) ~64 ft
    ramp_along_m: -140.0             # Ramp/IFLOLS datum ~140m aft of ship reference (near stern)
    ramp_lateral_m: -10.0            # IFLOLS on PORT side of landing area (negative = left of ship heading)
    glideslope_deg: 3.5              # Standard USN FLOLS glideslope
    landing_course_offset_deg: 9.0   # Angled deck offset from BRC (confirmed by community math)
    beam_width_m: 12.0               # Standard FLOLS beam width

  forrestal:
    name_patterns: ["forrestal", "cv-59", "cv-60", "cv-61", "cv-62"]
    type_patterns: ["Carrier+Tomcat", "AircraftCarrier+Forrestal"]
    # USS Forrestal (CV-59), first supercarrier with angled deck (Heatblur model).
    # Slightly smaller than Nimitz, similar angled deck geometry.
    # Angled deck: ~9° (early angled deck design).
    # Sources: Heatblur forums, Forrestal-class specs, DCS community feedback
    deck_altitude_m: 17.5            # Flight deck height at landing area (MSL) ~57 ft
    ramp_along_m: -130.0             # Ramp/IFLOLS datum ~130m aft of ship reference
    ramp_lateral_m: -10.0            # IFLOLS on PORT side of landing area
    glideslope_deg: 3.5              # Standard USN FLOLS glideslope
    landing_course_offset_deg: 9.0   # Angled deck offset
    beam_width_m: 12.0               # Standard FLOLS beam width
