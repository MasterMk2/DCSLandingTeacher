# DCS Landing Teacher deployment.
# The frontend and API are hosted by separate services behind a reverse proxy.
#
#   docker compose up --build
#
# Configuration is read from ./.env (see .env.example). Only the variables
# that must differ from the defaults are repeated below; container-specific
# paths (PostgreSQL on the persistent volume, baked-in config/frontend) are fixed.

services:
  reverse-proxy:
    build:
      context: ./docker/reverse-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DLT_HOST:-0.0.0.0}:${DLT_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - web_internal

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - web_internal

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: dcs-landing-teacher-api:latest
    restart: unless-stopped
    expose:
      - "9001"
    env_file:
      - path: .env
        required: false
    environment:
      DLT_DATABASE_URL: postgresql+psycopg://${DLT_POSTGRES_USER:?DLT_POSTGRES_USER must be set}:${DLT_POSTGRES_PASSWORD:?DLT_POSTGRES_PASSWORD must be set}@db:5432/${DLT_POSTGRES_DB:?DLT_POSTGRES_DB must be set}
      DLT_GRADING_CONFIG_PATH: /app/config/grading.yaml
      DLT_CARRIERS_CONFIG_PATH: /app/config/carriers.yaml
      DLT_TACVIEW_HOST: ${DLT_TACVIEW_HOST:-host.docker.internal}
      DLT_TACVIEW_PORT: ${DLT_TACVIEW_PORT:-42674}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migration-job:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web_internal
      - backend_internal
      - provider_outbound
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:9001/api/health')",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DLT_POSTGRES_DB:?DLT_POSTGRES_DB must be set}
      POSTGRES_USER: ${DLT_POSTGRES_USER:?DLT_POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${DLT_POSTGRES_PASSWORD:?DLT_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migration-job:
    build:
      context: .
      dockerfile: docker/migration-job/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DLT_POSTGRES_DB:?DLT_POSTGRES_DB must be set}
      DB_USER: ${DLT_POSTGRES_USER:?DLT_POSTGRES_USER must be set}
      DB_PASSWORD: ${DLT_POSTGRES_PASSWORD:?DLT_POSTGRES_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_internal
    restart: "no"

volumes:
  postgres_data:

networks:
  web_internal:
  backend_internal:
    internal: true
  provider_outbound:
