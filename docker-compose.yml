# DCS Landing Teacher - single-container deployment.
# FastAPI serves both the REST/WebSocket API and the built frontend (SPA).
#
#   docker compose up --build
#
# Configuration is read from ./.env (see .env.example). Only the variables
# that must differ from the defaults are repeated below; container-specific
# paths (SQLite on the persistent volume, baked-in config/frontend) are fixed.

services:
  app:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: dcs-landing-teacher:latest
    restart: unless-stopped
    ports:
      - "${DLT_PORT:-8000}:8000"
    env_file:
      # Optional; copy .env.example to .env to customize Tacview host/port,
      # password, CORS origins, etc.
      - path: .env
        required: false
    environment:
      # SQLite lives on the named volume below (survives container rebuilds).
      DLT_DATABASE_URL: sqlite+aiosqlite:////data/dlt.db
      DLT_GRADING_CONFIG_PATH: /app/config/grading.yaml
      DLT_CARRIERS_CONFIG_PATH: /app/config/carriers.yaml
      DLT_FRONTEND_DIST_DIR: /app/frontend/dist
      # Alembic migrations are applied automatically at startup; set to
      # "false" to fall back to the legacy create_all bootstrap.
      DLT_MIGRATIONS_ON_STARTUP: ${DLT_MIGRATIONS_ON_STARTUP:-true}
      DLT_MIGRATIONS_DIR: /app/migrations
      # Default: reach a Tacview exporter running on the Docker host
      # (works on Windows/macOS natively and on Linux via extra_hosts).
      DLT_TACVIEW_HOST: ${DLT_TACVIEW_HOST:-host.docker.internal}
      DLT_TACVIEW_PORT: ${DLT_TACVIEW_PORT:-31010}
    volumes:
      - dlt-data:/data
      # Mount grading thresholds read-only so they can be tuned live;
      # remove this line to use the copy baked into the image.
      - ./config:/app/config:ro
    extra_hosts:
      # Linux equivalent of host.docker.internal (no-op elsewhere).
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      DLT_POSTGRES_DB: ${DLT_POSTGRES_DB:?DLT_POSTGRES_DB must be set}
      DLT_POSTGRES_USER: ${DLT_POSTGRES_USER:?DLT_POSTGRES_USER must be set}
      DLT_POSTGRES_PASSWORD: ${DLT_POSTGRES_PASSWORD:?DLT_POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${DLT_POSTGRES_USER}\" -d \"$${DLT_POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migration-job:
    build:
      context: .
      dockerfile: docker/migration-job/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DLT_POSTGRES_DB:?DLT_POSTGRES_DB must be set}
      DB_USER: ${DLT_POSTGRES_USER:?DLT_POSTGRES_USER must be set}
      DB_PASSWORD: ${DLT_POSTGRES_PASSWORD:?DLT_POSTGRES_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_internal
    restart: "no"

volumes:
  dlt-data:
  postgres_data:
  api_run:

networks:
  backend_internal:
    internal: true
  provider_outbound:
