name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  text-encoding:
    name: Git text encoding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check actual staging, BOM preservation and checkout
        run: python -m unittest discover -s scripts/tests -p test_git_text_attributes.py -v

      - name: Check development entry failure and privacy guards
        run: python -m unittest discover -s scripts/tests -p test_dev_entry.py -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm and inspect environment
        run: |
          npm install --global npm@11.9.0
          npm run doctor

      - name: Install dependencies from lock
        run: npm ci

      - name: Check
        run: npm run check

      - name: Confirm dependency files remain unchanged
        run: git diff --exit-code -- package.json package-lock.json

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlt_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: dlt_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dlt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DLT_TEST_POSTGRES_URL: postgresql+psycopg://dlt_test:test-password@127.0.0.1:5432/dlt_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"

      - name: Install pinned Python
        run: uv python install --no-bin --no-registry

      - name: Install backend dependencies
        run: |
          uv lock --check
          uv sync --frozen --no-install-project
          uv run --no-sync python ../tools/dev.py doctor

      # TODO: コード修正後有効化する
      # - name: Type check
      #   run: uv run --no-sync basedpyright

      - name: Check
        run: uv run --no-sync python ../tools/dev.py check

      - name: Confirm dependency files remain unchanged
        run: git diff --exit-code -- pyproject.toml uv.lock

  migration-job:
    name: Migration job
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlt_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: dlt_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dlt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: ../backend/src
      DLT_TEST_POSTGRES_URL: postgresql+psycopg://dlt_test:test-password@127.0.0.1:5432/dlt_test
    defaults:
      run:
        working-directory: migration-job
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"

      - name: Install pinned Python
        run: uv python install --no-bin --no-registry

      - name: Install migration job with dev dependencies
        run: |
          uv lock --check
          uv sync --frozen
          uv run --no-sync python ../tools/dev.py doctor

      - name: Check
        run: uv run --no-sync python ../tools/dev.py check

      - name: Confirm dependency files remain unchanged
        run: git diff --exit-code -- pyproject.toml uv.lock

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: dlt-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DLT_HOST: 127.0.0.1
      DLT_PORT: "18080"
      DLT_POSTGRES_DB: dcs_landing_teacher
      DLT_POSTGRES_USER: dcs_landing_teacher
      # Synthetic credentials deliberately cover URI-reserved characters.
      DLT_POSTGRES_PASSWORD: "test@pass/word:%#?+"
    steps:
      - uses: actions/checkout@v4

      - name: Validate smoke-check isolation guards
        run: python -m unittest discover -s scripts/tests -p test_ci_compose_smoke.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker Compose services
        run: docker compose build

      - name: Exercise isolated Compose startup and recreation
        run: python scripts/ci_compose_smoke.py
