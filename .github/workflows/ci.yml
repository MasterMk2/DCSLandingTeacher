name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync --frozen --no-install-project

      - name: Lint
        run: uv run ruff check .

      # TODO: コード修正後有効化する
      # - name: Type check
      #   run: uv run basedpyright

      - name: Test
        run: uv run pytest -q

  migration-job:
    name: Migration job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration-job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install migration job with dev dependencies
        run: uv sync --frozen --no-install-project

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Test
        run: uv run pytest -q

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          DLT_POSTGRES_DB: dcs_landing_teacher
          DLT_POSTGRES_USER: dcs_landing_teacher
          DLT_POSTGRES_PASSWORD: test-password
        run: docker compose config --quiet

      - name: Build Docker Compose services
        env:
          DLT_POSTGRES_DB: dcs_landing_teacher
          DLT_POSTGRES_USER: dcs_landing_teacher
          DLT_POSTGRES_PASSWORD: test-password
        run: docker compose build
