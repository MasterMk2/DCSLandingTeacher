name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  text-encoding:
    name: Git text encoding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check actual staging, BOM preservation and checkout
        run: python -m unittest discover -s scripts/tests -p test_git_text_attributes.py -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlt_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: dlt_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dlt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DLT_TEST_POSTGRES_URL: postgresql+psycopg://dlt_test:test-password@127.0.0.1:5432/dlt_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: uv sync --frozen --no-install-project

      - name: Lint
        run: uv run ruff check .

      # TODO: コード修正後有効化する
      # - name: Type check
      #   run: uv run basedpyright

      - name: Test
        run: uv run pytest -q

  migration-job:
    name: Migration job
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dlt_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: dlt_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dlt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: ../backend/src
      DLT_TEST_POSTGRES_URL: postgresql+psycopg://dlt_test:test-password@127.0.0.1:5432/dlt_test
    defaults:
      run:
        working-directory: migration-job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install migration job with dev dependencies
        run: uv sync --frozen --no-install-project

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Test
        run: uv run pytest -q

      - name: SQLite to PostgreSQL migration tests
        run: uv run pytest ../scripts/tests/test_migrate_sqlite.py -q

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: dlt-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DLT_HOST: 127.0.0.1
      DLT_PORT: "18080"
      DLT_POSTGRES_DB: dcs_landing_teacher
      DLT_POSTGRES_USER: dcs_landing_teacher
      # Synthetic credentials deliberately cover URI-reserved characters.
      DLT_POSTGRES_PASSWORD: "test@pass/word:%#?+"
    steps:
      - uses: actions/checkout@v4

      - name: Validate smoke-check isolation guards
        run: python -m unittest discover -s scripts/tests -p test_ci_compose_smoke.py

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker Compose services
        run: docker compose build

      - name: Exercise isolated Compose startup and recreation
        run: python scripts/ci_compose_smoke.py
