server {
    listen 8001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite assets
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}